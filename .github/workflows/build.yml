name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-2025
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: x64
      - name: Install GTK development files
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install shards
        run: shards --frozen install
      - name: Test
        run: crystal spec
      - name: Build
        run: shards build --release --no-debug

      - name: Package Linux
        if: matrix.os == 'ubuntu'
        run: |
          mkdir dist
          tar -czf dist/icon-viewer-linux-x64.tar.gz -C bin icon-viewer

      - name: Package Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory | Out-Null
          Compress-Archive bin/icon-viewer.exe dist/icon-viewer-windows-x64.zip

      - name: Package macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app=IconViewer.app
          exe="$app/Contents/MacOS/icon-viewer"
          frameworks="$app/Contents/Frameworks"
          mkdir -p "$(dirname "$exe")" "$frameworks" dist
          cp bin/icon-viewer "$exe"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>icon-viewer</string>
            <key>CFBundleIdentifier</key><string>com.github.kojix2.icon-viewer</string>
            <key>CFBundleName</key><string>Icon Viewer</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(shards version)</string>
            <key>CFBundleVersion</key><string>$(shards version)</string>
          </dict></plist>
          EOF
          pending=("$exe")
          index=0
          while [ "$index" -lt "${#pending[@]}" ]; do
            file="${pending[$index]}"
            index=$((index + 1))
            while read -r dependency; do
              case "$dependency" in
                /System/*|/usr/lib/*|@*) continue ;;
                /*) ;;
                *) continue ;;
              esac
              bundled="$frameworks/$(basename "$dependency")"
              if [ ! -f "$bundled" ]; then
                cp -L "$dependency" "$bundled"
                chmod u+w "$bundled"
                pending+=("$bundled")
              fi
              install_name_tool -change "$dependency" "@executable_path/../Frameworks/$(basename "$dependency")" "$file"
            done < <(otool -L "$file" | tail -n +2 | awk '{print $1}')
            if [ "$file" != "$exe" ]; then
              install_name_tool -id "@executable_path/../Frameworks/$(basename "$file")" "$file"
            fi
          done
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/icon-viewer-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
